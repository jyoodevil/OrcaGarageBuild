# OrcaGarageBuild: build only the Windows x64 installer and portable zip.
# build_all.yml (every platform, unit tests, flatpak) no longer runs on pushes
# to main in this fork; start it by hand from the Actions tab when needed.
name: GarageBuild Windows

on:
  push:
    branches:
      - main
    paths:
      - 'deps/**'
      - 'deps_src/**'
      - 'cmake/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - 'version.inc'
      - 'localization/**'
      - 'resources/**'
      - 'build_win.bat'
      - '.github/workflows/build_*.yml'
      - '.github/workflows/garage_windows.yml'
  workflow_dispatch:

concurrency:
  group: garage-windows-${{ github.ref }}
  # A deps build takes over an hour; let it finish so its cache is saved.
  cancel-in-progress: false

jobs:
  build_windows:
    name: Build Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
    secrets: inherit

  # Runs the OrcaGarageBuild tests from the test binaries the build uploads.
  garage_tests:
    name: GarageBuild tests
    needs: build_windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            resources
      - name: Restore Test Artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ github.sha }}-tests-windows-x64
      - name: Run the ooze stop tests
        shell: bash
        run: |
          tar -xf build_tests.tar
          for suite in libslic3r fff_print; do
            exe=$(find build/tests/$suite -name "${suite}_tests.exe" | head -n 1)
            echo "== $exe"
            "$exe" "[OozeStop]"
          done
